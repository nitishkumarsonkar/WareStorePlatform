version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: warestore_postgres
    restart: always
    environment:
      POSTGRES_USER: warestore_user
      POSTGRES_PASSWORD: warestore_password
      POSTGRES_DB: warestore_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warestore_user -d warestore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: warestore_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
